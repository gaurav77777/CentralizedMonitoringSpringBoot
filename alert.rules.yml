groups:
  - name: springboot-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[1m]) > 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "High 5xx Error Rate"
          description: "More than 1 error per second from the Spring Boot service"
